services:
  - type: web
    name: food-waste-management-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: food-waste-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: food-waste-db
    plan: free

